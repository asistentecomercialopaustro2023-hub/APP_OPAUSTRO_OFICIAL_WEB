<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Permissions-Policy" content="camera=(), geolocation=(), microphone=(), payment=(), usb=(), bluetooth=()">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;">
<meta name="theme-color" content="#005B9E">
<link rel="apple-touch-icon" href="../Recuros_imagenes/icon-192.png?v=1.0.0">
<title>Cabinets en Bodega - OPAUSTRO</title>
<style>
:root{--bg:#eef1f4;--surf:#fff;--surf2:#f7f9fb;--brd:#dfe5eb;--txt:#18202a;--mut:#687386;--acc:#111827;--accl:#eef2f7;--ok-c:#3B6D11;--ok-b:#EAF3DE;--r:10px;--rs:6px;}
@media(prefers-color-scheme:dark){:root{--bg:#0f1117;--surf:#1a1d27;--surf2:#21252f;--brd:#2e3340;--txt:#e8eaf0;--mut:#9ca3af;--acc:#5DCAA5;--accl:#04342C;}}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5;}
.hdr{background:rgba(255,255,255,.96);backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--brd);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;gap:10px;flex-wrap:wrap;box-shadow:0 1px 0 rgba(15,23,42,.02);}
.brand-left{display:flex;align-items:center;gap:12px;min-width:220px}
.brand-opa{height:32px;width:auto;max-width:140px;object-fit:contain}
.htitle{font-size:15px;font-weight:800;}
.hsub{font-size:11px;color:var(--mut);}
.hright{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.slbl{font-size:11px;color:var(--mut);}
.dot{width:7px;height:7px;border-radius:50%;background:#10b981;display:inline-block;margin-right:4px;}
.btn{padding:7px 13px;border-radius:var(--rs);font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--brd);background:var(--surf2);color:var(--txt);transition:.15s;white-space:nowrap;box-shadow:0 1px 1px rgba(15,23,42,.04);}
.btn:hover{opacity:.85;}
.wrap{max-width:1280px;margin:0 auto;padding:18px 20px;}
.card{background:var(--surf);border:1px solid var(--brd);border-radius:8px;padding:16px 18px;box-shadow:0 8px 22px rgba(15,23,42,.04);}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.ct{font-size:13px;font-weight:700;}
.cc{font-size:11px;color:var(--mut);}
.fs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;align-items:center;}
.fi{flex:1;min-width:220px;padding:7px 12px;border-radius:20px;border:1px solid var(--brd);background:var(--surf);color:var(--txt);font-size:13px;outline:none;}
.fi:focus{border-color:var(--acc);}
.tw{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{text-align:left;padding:7px 9px;font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--brd);white-space:nowrap;}
td{padding:9px 9px;border-bottom:1px solid var(--brd);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f4f7fa;}
.tp{font-family:monospace;font-weight:700;color:var(--acc);font-size:12px;}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap;background:var(--ok-b);color:var(--ok-c);}
.thumb{width:46px;height:46px;object-fit:cover;border-radius:4px;cursor:pointer;border:2px solid var(--brd);margin:1px;}
.thumb:hover{border-color:var(--acc);}
.nofoto{font-size:11px;color:var(--mut);}
.empty{text-align:center;padding:40px;color:var(--mut);font-size:13px;}
.lb-bg{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:900;display:none;align-items:center;justify-content:center;padding:20px;}
.lb-bg.on{display:flex;}
.lb-img{max-width:90vw;max-height:85vh;border-radius:var(--r);object-fit:contain;}
.lb-close{position:absolute;top:14px;right:18px;color:#fff;font-size:28px;cursor:pointer;background:none;border:none;}
.lb-cap{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#fff;font-size:13px;font-weight:600;}
.sp{display:inline-block;width:12px;height:12px;border:2px solid rgba(0,0,0,.15);border-top-color:var(--acc);border-radius:50%;animation:sp .6s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:640px){.hdr{padding:10px 12px;}.wrap{padding:12px 10px}.card{padding:12px}}
</style>
</head>
<body>

<div class="hdr">
  <div class="brand-left">
    <img class="brand-opa" src="../Recuros_imagenes/logo_color.png?v=1.0.0" alt="OPAUSTRO">
    <div><div class="htitle">🏭 Cabinets en Bodega</div><div class="hsub">Solo consulta — cabinets listos en stock (Bodega OK)</div></div>
  </div>
  <div class="hright">
    <span class="slbl" id="synclbl"><span class="dot"></span>Actualizado hace un momento</span>
    <button class="btn" id="btnRefresh" onclick="cargar()">↻ Actualizar</button>
  </div>
</div>

<div class="wrap">
  <div class="card">
    <div class="ch">
      <div class="ct">Cabinets disponibles (Bodega OK)</div>
      <div class="cc" id="conteo">0 cabinets</div>
    </div>
    <div class="fs">
      <input class="fi" id="buscador" placeholder="Buscar por placa o modelo..." oninput="filtrarYRender()">
    </div>
    <div class="tw">
      <table>
        <thead><tr><th>Placa</th><th>Modelo</th><th>Estado</th><th>Fotos</th></tr></thead>
        <tbody id="tb-bodega"></tbody>
      </table>
      <div class="empty" id="vacio" style="display:none">Sin cabinets en Bodega OK por el momento.</div>
    </div>
  </div>
</div>

<div class="lb-bg" id="lb" onclick="if(event.target===this)cerrarLB()">
  <button class="lb-close" onclick="cerrarLB()">&times;</button>
  <img class="lb-img" id="lb-img" src="" alt="">
  <div class="lb-cap" id="lb-cap"></div>
</div>

<script>
var APPS_URL='https://script.google.com/macros/s/AKfycbxPUAR6TvVYCFx8QjGFZdv8um8byUdubMPoKY5v0DbL0GwzqcvwmSMiuqnQkvBSmcPetw/exec';
var LOGISTICA_API_KEY='';
var equiposBodegaOk=[];
var REFRESH_MS=30000;

function apiKeyParam(){ return LOGISTICA_API_KEY ? '&apiKey='+encodeURIComponent(LOGISTICA_API_KEY) : ''; }

function driveFileId(url){
  var s=String(url||'');
  var m=s.match(/\/d\/([^\/]+)/)||s.match(/[?&]id=([^&]+)/);
  return m?m[1]:'';
}
function fotoSrc(url,large){
  var id=driveFileId(url);
  if(id) return 'https://drive.google.com/thumbnail?id='+id+'&sz='+(large?'w1600':'w240');
  return url;
}
function abrirLB(src,cap){
  document.getElementById('lb-img').src=src;
  document.getElementById('lb-cap').textContent=cap||'';
  document.getElementById('lb').classList.add('on');
}
function cerrarLB(){ document.getElementById('lb').classList.remove('on'); document.getElementById('lb-img').src=''; }

function escapeHtml(v){
  return String(v==null?'':v).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function renderFotos(e){
  var fs=e.fotosSalida||{};
  var vistas=['f','t','i'], lbs=['Frontal','Trasera','Interior'];
  var out='';
  vistas.forEach(function(v,i){
    if(fs[v]){
      var full=fotoSrc(fs[v],true), chico=fotoSrc(fs[v],false);
      var cap=lbs[i]+' — '+e.placa;
      out+='<img class="thumb" src="'+chico+'" title="'+escapeHtml(cap)+'" onclick="abrirLB(\''+full+'\',\''+escapeHtml(cap).replace(/'/g,"\\'")+'\')">';
    }
  });
  return out || '<span class="nofoto">Sin fotos</span>';
}

function filtrarYRender(){
  var q=(document.getElementById('buscador').value||'').toLowerCase().trim();
  var lista=equiposBodegaOk;
  if(q){
    lista=lista.filter(function(e){
      return (String(e.placa||'')+' '+String(e.modelo||'')).toLowerCase().indexOf(q)>=0;
    });
  }
  var tb=document.getElementById('tb-bodega');
  document.getElementById('conteo').textContent=lista.length+' cabinet'+(lista.length===1?'':'s');
  if(!lista.length){
    tb.innerHTML='';
    document.getElementById('vacio').style.display='block';
    return;
  }
  document.getElementById('vacio').style.display='none';
  tb.innerHTML=lista.map(function(e){
    return '<tr>'+
      '<td class="tp">'+escapeHtml(e.placa)+'</td>'+
      '<td>'+escapeHtml(e.modelo)+'</td>'+
      '<td><span class="badge">Bodega OK</span></td>'+
      '<td>'+renderFotos(e)+'</td>'+
    '</tr>';
  }).join('');
}

async function cargar(){
  var lbl=document.getElementById('synclbl');
  lbl.innerHTML='<span class="sp"></span> Actualizando...';
  try{
    var r=await fetch(APPS_URL+'?action=getAll'+apiKeyParam(),{redirect:'follow'});
    var j=await r.json();
    if(!j||!j.ok) throw new Error((j&&j.error)||'Respuesta invalida del servidor.');
    var eq=Object.values((j.db&&j.db.equipos)||{});
    equiposBodegaOk=eq.filter(function(e){ return e.estado==='BODEGA_OK'; });
    filtrarYRender();
    lbl.innerHTML='<span class="dot"></span>Actualizado '+new Date().toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'});
  }catch(err){
    lbl.innerHTML='<span class="dot" style="background:#A32D2D"></span>Error al actualizar';
    console.error(err);
  }
}

document.addEventListener('keydown',function(ev){ if(ev.key==='Escape') cerrarLB(); });
cargar();
setInterval(cargar,REFRESH_MS);
</script>
</body>
</html>
