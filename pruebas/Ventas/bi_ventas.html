<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://app.powerbi.com data: blob:; frame-src https://app.powerbi.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests;">
<meta name="theme-color" content="#0a1628">
<title>BI Ventas - Opaustro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;background:#0a1628}
.hdr{flex-shrink:0;background:linear-gradient(105deg,#0b3c49,#096c91);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:3px solid #2bafca;box-shadow:0 3px 14px rgba(11,60,73,.14)}
.back{display:inline-flex;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:9px;padding:8px 14px;color:#fff;font-size:12px;font-weight:650;text-decoration:none;white-space:nowrap}
.ti{font-size:14px;font-weight:800;letter-spacing:.03em;display:flex;align-items:center;gap:8px}
.ti small{font-size:11px;font-weight:500;color:rgba(255,255,255,.5);letter-spacing:0}
.frame{flex:1;position:relative;background:#f3f7f9}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.loading{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;color:#18313b;font-size:13px;background:radial-gradient(ellipse at 50% 35%,#fff 0,#f4f8fa 68%,#eaf2f5 100%);transition:opacity .35s ease}
.loading-card{width:min(420px,calc(100% - 32px));padding:28px;border:1px solid #dce7eb;border-radius:18px;background:rgba(255,255,255,.94);text-align:center;box-shadow:0 18px 48px rgba(11,60,73,.12)}
.loading-mark{width:48px;height:48px;margin:0 auto 15px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,#0b3c49,#168092);color:white;font-size:23px;font-weight:800;box-shadow:0 8px 18px rgba(22,128,146,.2)}
.loading-title{font-size:16px;font-weight:800;color:#0b3c49}.loading-copy{margin-top:6px;color:#6f858e;font-size:12px;line-height:1.5}
.loading-track{height:5px;margin-top:19px;overflow:hidden;border-radius:10px;background:#e6eef0}.loading-track::after{content:"";display:block;width:35%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#168092,#2bafca);animation:load-slide 1.5s ease-in-out infinite alternate}
@keyframes load-slide{to{transform:translateX(185%)}}
@media(prefers-reduced-motion:reduce){.loading-track::after{animation:none;width:65%}}
html.embed-mode .hdr{display:none!important}
html.embed-mode body{background:#f3f5f8}
</style>
<script>
if(new URLSearchParams(location.search).get('embed')==='1') document.documentElement.classList.add('embed-mode');
</script>
</head>
<body>
<div class="hdr">
  <a class="back" href="./modulo_ventas.html">Volver</a>
  <div class="ti">BI Ventas <small>Power BI</small></div>
</div>
<div class="frame">
  <div class="loading" id="loading"><div class="loading-card"><div class="loading-mark">O</div><div class="loading-title">Preparando BI Ventas</div><div class="loading-copy">Conectando con el informe de Power BI. Los datos y filtros del tablero se cargan dentro del reporte.</div><div class="loading-track" aria-hidden="true"></div></div></div>
<iframe id="frame" title="BI Ventas Power BI" allowfullscreen loading="eager" src="https://app.powerbi.com/view?r=eyJrIjoiZDcxNzk2ODktYmRkNS00ZGYzLWE5N2MtNGM3MjY4ZjZhMmFlIiwidCI6IjYzNDBhYjFkLTM0OWQtNDUyNS1iMTg1LWY4YjZiM2YzNjM1ZCIsImMiOjR9"></iframe>
</div>
<script>
document.getElementById('frame').onload=function(){var l=document.getElementById('loading');if(l)l.style.display='none';};
</script>
<script src="../session-activity.js"></script>
</body>
</html>
